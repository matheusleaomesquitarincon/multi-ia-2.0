<h2>Crie uma senha nova</h2>

<p>Alguém pediu para trocar a senha da sua conta no Multi-IA. Se foi você, clique no link abaixo para criar uma senha nova:</p>

<p><a href="{{ .SiteURL }}/confirmar?token_hash={{ .TokenHash }}&type=recovery">Criar uma senha nova</a></p>

<p>O link vale por pouco tempo e só pode ser usado uma vez.</p>

<p>Se não foi você, ignore este e-mail: a sua senha continua a mesma.</p>
