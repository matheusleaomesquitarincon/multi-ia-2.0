# Checagens automáticas: rodam em todo pull request e em todo push na main.
# Se alguma falhar, o PR mostra um X vermelho e não deve ser aprovado.
name: Checagens

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: BackEnd
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackEnd
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BackEnd/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

  frontend:
    name: FrontEnd
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  # Monta um banco temporário com as migrações e a empresa de exemplo e roda os testes das regras de acesso e da
  # carteira (BackEnd/supabase/tests/). O banco some no fim; o banco de verdade não é tocado.
  database:
    name: Banco de dados
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackEnd
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      # Só o que os testes usam: banco, login e Storage (o resto do Supabase local fica desligado).
      - name: Montar o banco com as migrações
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,realtime,postgres-meta

      - name: Testes do banco
        run: supabase test db
